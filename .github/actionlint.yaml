# actionlint configuration (https://github.com/rhysd/actionlint).
# The arm64 runner labels below are official GitHub-hosted labels
# (see actions/runner-images), but actionlint's bundled label list lags
# behind them; declaring them here keeps `actionlint` green for the E2E
# workflow. GitHub itself ignores this file.
self-hosted-runner:
  labels:
    - ubuntu-26.04-arm
    - windows-11-arm
