name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The Linux job runs the suite natively, the way the dev container runs it
# locally: Go at the dev container's version (.devcontainer/Dockerfile) plus
# the runner's stock Docker, with the same TESTCONTAINERS_RYUK_DISABLED knob.
# The Windows jobs run it natively too, with the same Go, rather than through
# the compose runner image (tests/e2e/windows/Dockerfile-runner) that lets a
# local Windows host need only Docker: on windows-11-arm, extracting Go into
# that image alone took two and a half minutes. See docs/e2e.md.

jobs:
  e2e-linux:
    if: github.repository == 'version-fox/vfox-java'
    name: Linux container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      # Ryuk publishes a port on the host daemon and waits for the suite to
      # dial back to it; the dev container disables it (it runs
      # Docker-out-of-Docker), and CI matches so both paths stay identical.
      # Containers are terminated explicitly via t.Cleanup instead.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      - run: go test -v -timeout 55m -run TestE2E ./linux
        working-directory: tests/e2e

  e2e-windows:
    if: github.repository == 'version-fox/vfox-java'
    name: Windows container (${{ matrix.runs-on }})
    strategy:
      fail-fast: false
      matrix:
        # TODO See https://github.com/actions/runner-images/issues/13729
        runs-on: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      # Three containers at a time, as on Linux, once Docker is off C:.
      E2E_MAX_JOBS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # C: is a network-attached disk on these runners, where extracting the
      # servercore image took five minutes; Docker, Go's caches and the temp
      # directory go to a local disk instead.
      - run: pwsh -NoProfile -File tests/e2e/windows/use-local-disk.ps1
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache: false
      # The windows-11-arm runner ships no Docker for Windows containers, so
      # the engine is built here with that Go; the build, minutes long, is
      # cached on the script that pins it.
      - if: matrix.runs-on == 'windows-11-arm'
        uses: actions/cache@v6
        with:
          path: C:\vfox-docker\moby\bundles
          key: moby-windows-arm64-${{ hashFiles('tests/e2e/windows/install-docker-arm64.ps1') }}
      - if: matrix.runs-on == 'windows-11-arm'
        run: pwsh -NoProfile -File tests/e2e/windows/install-docker-arm64.ps1
      - run: go test -v -timeout 55m -run TestE2E ./windows
        working-directory: tests/e2e
